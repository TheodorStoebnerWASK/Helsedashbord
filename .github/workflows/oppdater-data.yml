name: Oppdater data

on:
  schedule:
    # GitHub bruker UTC og starter ofte 5–60 min forsinket. Tidene er satt så data er klare før møtene:
    # 06:17 og 11:30 norsk vintertid (07:17 og 12:30 sommertid), hver dag.
    - cron: '17 5 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch: {}
  # Kjør også når koden eller oppsettet endres (ikke ved endringer i data/, så det blir ingen løkke)
  push:
    branches: [main]
    paths: ['scripts/**', 'config/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: oppdater-data
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hent og klassifiser
        run: node scripts/update-data.mjs --ki
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # Claude – legges inn under Settings → Secrets and variables → Actions
      - name: Lagre endringer
        run: |
          git config user.name "helsedashbord-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Ingen endringer"; exit 0; fi
          git commit -m "Oppdater data $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
