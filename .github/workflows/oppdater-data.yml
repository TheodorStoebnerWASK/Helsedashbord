name: Oppdater data

on:
  schedule:
    # Kl. 06:17 og 13:17 norsk vintertid (UTC+1) på hverdager, 06:17 i helgene
    - cron: '17 5 * * *'
    - cron: '17 12 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  models: read # gratis KI-klassifisering via GitHub Models

concurrency:
  group: oppdater-data
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hent og klassifiser
        run: node scripts/update-data.mjs --ki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lagre endringer
        run: |
          git config user.name "helsedashbord-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Ingen endringer"; exit 0; fi
          git commit -m "Oppdater data $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
